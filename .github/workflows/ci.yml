name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install Root Dependencies
      run: npm ci

    - name: Root Lint
      run: npm run lint

    - name: Root Typecheck
      run: npm run typecheck

    - name: Root Build
      run: npm run build

    - name: Root Test
      run: npm run test

    - name: Install Functions Dependencies
      run: |
        cd functions
        npm ci

    - name: Functions Lint
      run: |
        cd functions
        npm run lint

    - name: Functions Build
      run: |
        cd functions
        npm run build
